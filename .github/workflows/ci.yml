name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for WeasyPrint PDF rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies from the lockfile
        run: uv sync --all-extras --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      # Functional checks only. Benchmarks on shared runners are not treated as authoritative,
      # and Docker sandbox tests run in a dedicated job below.
      - name: Tests
        run: uv run pytest -m "not docker and not network" --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
