[project]
name = "perfpilot-ai"
version = "0.1.0"
description = "AI-powered code optimization backed by real profiling and reproducible benchmarks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "psutil>=6.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.3",
    "pandas>=2.2",
    "plotly>=5.22",
    "streamlit>=1.38",
    "weasyprint>=62",
    "xhtml2pdf>=0.2.16",
    "markdown>=3.6",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
sampling = ["py-spy>=0.3.14"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-psutil",
    "types-Markdown",
    "pandas-stubs",
]

[project.scripts]
perfpilot = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures/repos", "examples/*/reference", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT"]
ignore = ["S101", "S603", "S607", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "PT011"]
"examples/**" = ["S", "B"]
"evals/**" = ["S"]

[tool.mypy]
python_version = "3.12"
packages = ["backend"]
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "scipy.*", "plotly.*", "weasyprint.*", "streamlit.*", "pstats"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-ra --strict-markers"
markers = [
    "docker: requires a working Docker daemon (sandbox)",
    "network: requires outbound network access",
    "slow: long-running test",
    "pdf: requires WeasyPrint system libraries",
]
filterwarnings = ["ignore::DeprecationWarning:streamlit.*"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/cli.py"]
