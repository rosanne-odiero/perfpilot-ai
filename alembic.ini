# Alembic CLI configuration. The database URL comes from PerfPilot settings (PERFPILOT_DATA_DIR /
# PERFPILOT_DATABASE_URL), not from this file. Prefer the wrappers:
#   perfpilot init-db                                   apply migrations to the configured database
#   make migration-check                                fail if the ORM drifted from the head revision
#   make migration m="add foo table"                    autogenerate the next revision
#   make migration-baseline                             regenerate 0001 (only while it is the sole revision)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --silent REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME
