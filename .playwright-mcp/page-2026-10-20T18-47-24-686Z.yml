            - 'cell "Fetch everything the loop needs with one query (IN-list, eager loading, or a join) before the loop, index the rows in a dict, and batch writes. - Load what the loop needs with one query before it (`WHERE id IN (...)`, `select(...).where(Model.id.in_(ids))`, `selectinload`/`joinedload`, Django `select_related`/`prefetch_related`/`in_bulk`) and look rows up in a dict; batch writes with `executemany`, bulk inserts, or a single UPDATE." [ref=f2e3962]'
