    - heading "Architecture insights" [level=3] [ref=f2e761]
    - generic [ref=f2e762]:
      - paragraph [ref=f2e763]:
        - generic [ref=f2e764]: STATIC
        - text: Introduce a shared HTTP client
      - paragraph [ref=f2e765]: 15 call sites in 7 modules create a new HTTP client or session per call, so every request pays for connection and TLS setup and nothing is pooled. A single client owned by the application (created at startup or in a lifespan/dependency, closed on shutdown) and injected where needed fixes this once for every module, and gives one place for timeouts, retries and connection limits.
      - paragraph [ref=f2e766]: "Modules: core.ai_client, app.weather.service, core.insforge_auth, core.storage, app.payments.service_flutterwave, app.payments.service_daraja, app.whatsapp.service · generated by deterministic"
    - generic [ref=f2e767]:
      - paragraph [ref=f2e768]:
        - generic [ref=f2e769]: STATIC
        - text: Synchronous database access inside async code
      - paragraph [ref=f2e770]: "24 coroutines (10 of them request handlers) in 12 modules use a synchronous database session or driver directly. Each query blocks the event loop thread, so concurrent requests wait behind it. This is an architectural boundary decision rather than a local fix: either run these endpoints as plain `def` (thread pool) or move the data layer to an async driver/`AsyncSession`, and apply it consistently."
      - paragraph [ref=f2e771]: "Modules: app.whatsapp.service, app.intelligence.router, app.payments.router, app.intelligence.services.compatibility_checker, app.intelligence.services.soul_ai, app.intelligence.services.ai_ingredient_analyzer, app.intelligence.services.diary_compare, app.intelligence.services.predictions, app.intelligence.services.routine_recommender, app.intelligence.services.skin_analysis, app.intelligence.services.ingredient_scraper, admin · generated by deterministic"
    - generic [ref=f2e772]:
      - paragraph [ref=f2e773]:
        - generic [ref=f2e774]: STATIC
        - text: N+1 query pattern recurs across modules
      - paragraph [ref=f2e775]: 14 loops in 8 modules issue one query per item. Recurring N+1 patterns usually point at a data-access layer without batch helpers; adding bulk-fetch functions (load by ID list, eager loading options) to the repository/service layer makes the batched form the easy default.
      - paragraph [ref=f2e776]: "Modules: app.intelligence.services.routine_builder, app.intelligence.router, app.admin.homepage_router, app.admin.products_router, app.intelligence.services.soul_ai, app.orders.service, app.intelligence.services.routine_recommender, app.intelligence.services.ingredient_scraper · generated by deterministic"
    - generic [ref=f2e777]:
      - paragraph [ref=f2e778]:
        - generic [ref=f2e779]: STATIC
        - text: Findings outside request paths were deprioritized
      - paragraph [ref=f2e780]: 14 of 75 findings are in code that does not serve requests (CLI_SCRIPT x6, SEED_MIGRATION x7, TEST x1). Their priority is scaled down by the path-role factor; review them only if those workflows are slow in practice.
